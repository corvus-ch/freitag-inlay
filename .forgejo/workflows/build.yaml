name: Build PDF documents
on:
  workflow_call:
  pull_request:
    branches:
      - trunk
  push:
    tags:
      - v*

jobs:
  build_pdf:
    runs-on: docker
    container: codeberg.org/corvus-ch/texlive
    strategy:
      matrix:
        document: [bandplan, dotted, gridded, sota-log]
        format: [a5, a6, f26]
        language: [de, en]

    steps:
      - name: Set up Git repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Update git info
        run: ./update-git-info.sh

      - name: Compile document
        run: make ${{ matrix.document }}-${{ matrix.format }}-${{ matrix.language }}-booklet.pdf

      - name: Upload document
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.document }}-${{ matrix.format }}-${{ matrix.language }}.pdf
          path: ${{ matrix.document }}-${{ matrix.format }}-${{ matrix.language }}.pdf
          compression-level: 0

      - name: Upload booklet
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.document }}-${{ matrix.format }}-${{ matrix.language }}-booklet.pdf
          path: ${{ matrix.document }}-${{ matrix.format }}-${{ matrix.language }}-booklet.pdf
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_pdf
    runs-on: docker
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Download artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.5.3
        with:
          direction: upload
          url: "https://codeberg.org"
          release-dir: artifacts
          token: ${{ secrets.TOKEN }}
