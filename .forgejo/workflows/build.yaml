name: Build PDF documents
on:
  workflow_call:
  pull_request:
    branches:
      - trunk
  push:
    tags:
      - v*

jobs:
  build_pdf:
    runs-on: docker
    strategy:
      matrix:
        name:
          - dotted
          - gridded
          - sota-log

    steps:
      - name: Set up Git repository
        uses: code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Update git info
        run: ./update-git-info.sh

      - name: Compile inlay
        uses: github.com/xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.name }}-inlay.tex
          latexmk_use_xelatex: true

      - name: Compile main document
        uses: github.com/xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.name }}.tex
          latexmk_use_xelatex: true

      - name: Upload PDF
        uses: code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.pdf
          path: ${{ matrix.name }}.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Download artifacts
        uses: code.forgejo.org/forgejo/download-artifact@v4

      - name: Build changelog
        id: build_changelog
        uses: github.com/mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Create Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.5.3
        with:
          direction: upload
          url: "https://codeberg.org"
          release-dir: artifacts
          release-notes: ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.TOKEN }}

